<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manpower Master - PRDMS</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/style.css">

<style>
/* Manpower Master role permissions */
body.manpower-readonly .admin-manpower-only,
body.manpower-readonly .manpower-action-col,
body.manpower-readonly th.manpower-action-col {
    display: none !important;
}
</style>

</head>

<body>
<script src="../js/cloud.js"></script><script src="../js/auth.js"></script>

    <!-- NAVIGATION -->
    <header class="page-topbar no-print"><a href="../index.html"><i class="bi bi-grid-1x2-fill me-2"></i>Dashboard</a><div class="module-title">MANPOWER MASTER</div><div class="page-user"><i class="bi bi-person-circle"></i><strong data-user-name>User</strong><button type="button" onclick="openChangePassword()"><i class="bi bi-key"></i></button><button type="button" onclick="PRDMSAuth.logout()"><i class="bi bi-box-arrow-right"></i></button></div></header>


    <!-- PAGE -->
    <div class="container-fluid mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <div>
                <h4 class="fw-bold mb-1">
                    Manpower Master
                </h4>

                <small class="text-muted">
                    Official Changed & Repair Man-Hour Rates
                </small>
            </div>

            <button
                class="btn btn-primary admin-manpower-only"
                id="addManpowerBtn">

                <i class="bi bi-plus-circle"></i>
                Add Item

            </button>

        </div>


        <!-- SEARCH -->

        <div class="row mb-3">

            <div class="col-md-6">

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>

                    <input
                        type="text"
                        id="manpowerSearch"
                        class="form-control"
                        placeholder="Search manpower item...">

                </div>

            </div>

        </div>


        <!-- TABLE -->

        <div class="table-responsive">

            <table
                class="table table-bordered table-hover align-middle"
                id="manpowerTable">

                <thead class="table-light">

                    <tr>

                        <th style="width:70px;">
                            Sl. No.
                        </th>

                        <th>
                            Changed & Repair Items
                        </th>

                        <th
                            class="text-center"
                            style="width:180px;">

                            Changed
                            Man-Hrs.

                        </th>

                        <th
                            class="text-center"
                            style="width:180px;">

                            Repair
                            Man-Hrs.

                        </th>

                        <th
                            class="text-center manpower-action-col"
                            style="width:150px;">

                            Action

                        </th>

                    </tr>

                </thead>

                <tbody id="manpowerTableBody">
                </tbody>

            </table>

        </div>

    </div>


    <!-- ADD / EDIT MODAL -->

    <div
        class="modal fade"
        id="manpowerModal"
        tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="manpowerModalTitle">

                        Add Manpower Item

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">

                    <input
                        type="hidden"
                        id="manpowerEditIndex">


                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Changed & Repair Item
                        </label>

                        <input
                            type="text"
                            id="manpowerItem"
                            class="form-control"
                            placeholder="Enter item name">

                    </div>


                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Changed Man-Hrs.
                        </label>

                        <input
                            type="number"
                            id="changedManHours"
                            class="form-control"
                            step="0.01"
                            min="0"
                            placeholder="Leave blank if not applicable">

                    </div>


                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Repair Man-Hrs.
                        </label>

                        <input
                            type="number"
                            id="repairManHours"
                            class="form-control"
                            step="0.01"
                            min="0"
                            placeholder="Leave blank if not applicable">

                    </div>

                </div>


                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        id="saveManpowerBtn">

                        Save

                    </button>

                </div>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="../js/manpower.js"></script>

<div class="modal fade" id="changePasswordModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form id="changePasswordForm"><div class="modal-header"><h5 class="modal-title">Change Password</h5><button class="btn-close" type="button" data-bs-dismiss="modal"></button></div><div class="modal-body"><div id="changePasswordMsg"></div><label class="form-label">Current Password</label><input id="currentPasswordInput" type="password" class="form-control mb-3" required><label class="form-label">New Password</label><input id="newPasswordInput" type="password" class="form-control" required></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Change Password</button></div></form></div></div></div><script>function openChangePassword(){const m=document.getElementById("changePasswordModal");if(!m)return;bootstrap.Modal.getOrCreateInstance(m).show()}document.addEventListener("DOMContentLoaded",()=>{const f=document.getElementById("changePasswordForm");if(f)f.onsubmit=e=>{e.preventDefault();const r=PRDMSAuth.changeOwnPassword(currentPasswordInput.value,newPasswordInput.value);const box=document.getElementById("changePasswordMsg");if(r.ok){box.innerHTML='<div class="alert alert-success">Password changed successfully.</div>';f.reset();setTimeout(()=>bootstrap.Modal.getOrCreateInstance(document.getElementById("changePasswordModal")).hide(),700)}else box.innerHTML='<div class="alert alert-danger">'+r.message+'</div>'}});</script></body>

</html>
